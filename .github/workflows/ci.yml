name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests, lint scope, and accessibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint files changed by this PR
        run: >-
          npx eslint
          scripts/a11y-mobile-smoke.mjs
          scripts/with-app-env.mjs
          src/gianna/vault-explorer.tsx

      - name: Production build
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start app and run accessibility smoke tests
        shell: bash
        run: |
          set -euo pipefail

          log_file="${RUNNER_TEMP}/fengtu-yicang-vite.log"
          npm run dev > "$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              ready=true
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "The Vite dev server exited before becoming ready."
              cat "$log_file"
              exit 1
            fi

            sleep 2
          done

          if [[ "$ready" != "true" ]]; then
            echo "The Vite dev server did not become ready within 120 seconds."
            cat "$log_file"
            exit 1
          fi

          npm run test:a11y
